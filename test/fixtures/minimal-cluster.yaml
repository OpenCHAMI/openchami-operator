apiVersion: openchami.org/v1alpha1
kind: OpenCHAMICluster
metadata:
  name: testcluster
  namespace: default
  annotations:
    # Safety: don't clean up Vault or S3 when this test cluster is deleted
    # openchami.org/cleanup-vault: "true"
    # openchami.org/cleanup-s3: "true"
spec:
  clusterName: testcluster
  domain: testcluster.local

  platform:
    vault:
      address: "http://localhost:8200"  # Vault dev mode — no TLS in dev
      authMethod: appRole
      appRoleSecretRef:
        name: testcluster-approle     # created by hack/local-dev/seed-vault.sh

    objectStorage:
      endpoint: "http://localhost:4566"  # localstack
      bucket: testcluster-boot-images
      tlsInsecure: true

  networkProbe:
    enabled: false   # disabled in dev — nodes pre-labeled via kind-config.yaml

  services:
    smd:
      enabled: true
      replicas: 1
    tokensmith:
      enabled: true
      oidcProvider: vault
    bootService:
      enabled: true
      replicas: 1
    metadataService:
      enabled: true
      replicas: 1
    coreDHCP:
      enabled: true
      nodeSelector:
        openchami.org/testcluster/provision-network-ready: "true"
      leaseRanges:
        - subnet: 192.168.100.0/24
          start: 192.168.100.100
          end: 192.168.100.200
    magellan:
      enabled: true
      bmcSubnet: 192.168.200.0/24
      nodeSelector:
        openchami.org/testcluster/bmc-network-ready: "true"
      schedule: "0 * * * *"   # hourly in dev

  networking:
    gatewayClass: envoy
    tls:
      issuer: selfsigned-dev   # use a selfsigned issuer in dev

  database:
    instances: 1   # single instance in dev
    storageSize: 5Gi

  logging:
    enabled: true
    logBucket: testcluster-logs
    retentionDays: 7
    flushIntervalSeconds: 30

  operatorChannel: stable
