# Full-featured cluster with network probing enabled.
# Represents a production-like configuration.
apiVersion: openchami.openchami.org/v1alpha1
kind: OpenCHAMICluster
metadata:
  name: venado-prod
  namespace: default
spec:
  clusterName: venado-prod
  domain: venado.hpc.example.com

  platform:
    vault:
      address: "https://vault.openchami-platform.svc.cluster.local:8200"
      authMethod: kubernetes
      caBundleSecretRef:
        name: vault-ca-bundle
    objectStorage:
      endpoint: "http://versitygw.openchami-platform.svc.cluster.local:10000"

  networkProbe:
    enabled: true
    intervalSeconds: 300
    provisionNetwork:
      subnet: 192.168.1.0/24
      validateHost: "192.168.1.1"
      validatePort: 22
      validateTimeout: "3s"
    bmcNetwork:
      subnet: 192.168.2.0/24
      validateHost: "192.168.2.1"
      validatePort: 623
      validateTimeout: "5s"

  services:
    smd:
      replicas: 2
    tokensmith:
      oidcProvider: vault
    bootService:
      replicas: 2
    metadataService:
      replicas: 2
    coreDHCP:
      # nodeSelector omitted — generated from probe labels
      leaseRanges:
        - subnet: 192.168.1.0/24
          start: 192.168.1.100
          end: 192.168.1.200
      unknownLeaseDuration: "5m"
      knownLeaseDuration: "1h"
    magellan:
      # nodeSelector omitted — generated from probe labels
      bmcSubnet: 192.168.2.0/24
      schedule: "*/30 * * * *"
      concurrencyPolicy: Forbid

  networking:
    gatewayClass: envoy
    tls:
      issuer: vault-pki-issuer

  database:
    instances: 3
    storageSize: 20Gi
    backupEnabled: false

  logging:
    enabled: true
    retentionDays: 90
    flushIntervalSeconds: 60

  observability:
    prometheusOperator: true

  operatorChannel: stable
