apiVersion: openchami.openchami.org/v1alpha1
kind: OpenCHAMIControlPlane
metadata:
  name: smoke-local
  namespace: default
spec:
  clusterName: smoke-local
  domain: smoke-local.local
  platform:
    vault:
      address: http://openchami-vault-dev:8200
      authMethod: appRole
      appRoleSecretRef:
        name: smoke-local-vault-approle
    objectStorage:
      endpoint: http://openchami-localstack-dev:4566
      bucket: smoke-local-boot-images
      tlsInsecure: true
  networkProbe:
    enabled: false
  services:
    smd:
      enabled: true
      replicas: 1
    tokensmith:
      enabled: true
      oidcProvider: vault
    bootService:
      enabled: false
    metadataService:
      enabled: false
    coreDHCP:
      enabled: false
    magellan:
      enabled: false
  networking:
    gatewayClass: envoy
    tls:
      issuer: selfsigned-dev
  database:
    instances: 1
    storageSize: 5Gi
  logging:
    enabled: false
  observability:
    prometheusOperator: false
  operatorChannel: stable