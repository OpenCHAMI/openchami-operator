# This rule is not used by the project openchami-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the openchami.openchami.org.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: openchami-operator
    app.kubernetes.io/managed-by: kustomize
  name: openchamicluster-editor-role
rules:
- apiGroups:
  - openchami.openchami.org
  resources:
  - openchamiclusters
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - openchami.openchami.org
  resources:
  - openchamiclusters/status
  verbs:
  - get
