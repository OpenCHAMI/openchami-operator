---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-openchami-openchami-org-v1alpha1-openchamicontrolplane
  failurePolicy: Fail
  name: mopenchamicontrolplane.kb.io
  rules:
  - apiGroups:
    - openchami.openchami.org
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - openchamicontrolplanes
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-openchami-openchami-org-v1alpha1-openchamicontrolplane
  failurePolicy: Fail
  name: vopenchamicontrolplane.kb.io
  rules:
  - apiGroups:
    - openchami.openchami.org
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - openchamicontrolplanes
  sideEffects: None
