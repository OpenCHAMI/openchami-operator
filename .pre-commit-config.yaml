# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
        args: [--allow-multiple-documents]
        # Skip the kustomize patches under config/ — they include schema-violating
        # template fields that controller-gen emits and yamllint trips on.
        exclude: ^config/.*\.yaml$
    -   id: check-added-large-files
    -   id: check-merge-conflict
    -   id: detect-private-key

-   repo: https://github.com/fsfe/reuse-tool
    rev: v5.1.1
    hooks:
    -   id: reuse-lint-file

-   repo: https://github.com/tekwizely/pre-commit-golang
    # See 'pre-commit help autoupdate'
    rev: v1.0.0-rc.2
    hooks:
    -   id: go-mod-tidy
    -   id: go-vet-mod
    -   id: go-fmt
    -   id: go-fmt-repo
    -   id: golangci-lint-mod

-   repo: local
    hooks:
    -   id: validate-invariants
        name: validate operator invariants
        entry: bash -c 'make validate-invariants'
        language: system
        pass_filenames: false
        files: '\.go$'
